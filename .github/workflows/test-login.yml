name: test-login

on:
  workflow_dispatch:
  push:
    branches: [feature/helm-deployment]
    paths: ['.github/workflows/test-login.yml']

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - run: aws sts get-caller-identity
      - run: aws eks update-kubeconfig --name myapp-dev-eks --region ap-south-1
      - run: kubectl get pods -n default
      - run: kubectl get ingress -n default
      - run: kubectl auth can-i create deployments -n default
      - run: kubectl auth can-i create ingresses.networking.k8s.io -n default
      - run: kubectl auth can-i create secrets -n default
